    /* Interlocking report: the lower markets rise alongside the energy indices. */
    .market-grid {

    .market-grid > .market-card.biomass {
      grid-row:2 / 4;

    .market-grid > .market-card.biomass {
      grid-column:7 / 13;
      --notch-x:calc((100% + var(--market-gap)) / 3);
      clip-path:polygon(var(--notch-x) 0,100% 0,100% 100%,0 100%,0 calc(var(--shoulder-height) + var(--market-gap)),var(--notch-x) calc(var(--shoulder-height) + var(--market-gap)));

    .biomass-timeline::before {
      content:""; position:absolute; left:1mm; right:1mm;
      top:calc(50% - .5mm); height:1px; background:#bfa678;
    }
    .timeline-event { position:relative; display:grid; grid-template-rows:minmax(0,1fr) 5mm minmax(0,1fr); min-width:0; }
    .transaction-card {
      grid-row:1; align-self:end; position:relative; padding:1mm;
      background:#f2ecdf; border:1px solid #d8c8aa;
      border-top:2px solid var(--accent); border-radius:4px;
    }
    .timeline-event:nth-child(even) .transaction-card { grid-row:3; align-self:start; }
    .transaction-card::after {
      content:""; position:absolute; left:50%; top:100%; height:2.5mm;
      border-left:1px solid #bfa678;
    }
    .timeline-event:nth-child(even) .transaction-card::after { top:auto; bottom:100%; }
    .transaction-marker {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:2mm; height:2mm; border:1px solid #fffdf7;
      border-radius:50%; background:var(--accent); z-index:1;
    }
    .transaction-date { display:block; color:#756b58; font-size:5.5pt; line-height:1.2; }
    .transaction-price { display:block; margin:.8mm 0 1mm; color:#705025; font-size:8pt; line-height:1.1; font-variant-numeric:tabular-nums; }
    .transaction-fields { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:1mm; row-gap:.6mm; margin:0; }
    .transaction-fields dt { color:#756b58; font-size:3.8pt; line-height:1.2; text-transform:uppercase; letter-spacing:0; }
    .transaction-fields dd { margin:0; color:#354334; font-size:4.8pt; line-height:1.15; overflow-wrap:anywhere; }
    /* Adaptive count; alternating cards share a two-column-wide lane. */
    .biomass-timeline { grid-template-columns:repeat(var(--event-count,6),minmax(0,1fr)); }
    .transaction-card { width:calc(200% + 1.4mm); }
    .timeline-event:nth-child(even) .transaction-card { transform:translateX(calc(-50% - .7mm)); }
    .transaction-card::after { left:25%; }
    .timeline-event:nth-child(even) .transaction-card::after { left:75%; }
    .biomass-timeline:has(.timeline-event:only-child) .transaction-card { width:100%; }
    /* Proposed default: typography replaces visible field labels. */
    .transaction-fields { display:flex; flex-direction:column; gap:.7mm; }
    .transaction-fields dt { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .transaction-fields dd { font-size:5pt; }
    .transaction-field-kind { font-weight:700; }
    .transaction-field-buyer { color:#756b58 !important; }
    .transaction-field-source { font-size:3.8pt !important; color:#756b58 !important; }
    .biomass-content > .table-scroll { flex:1; min-height:0; }
    .biomass-transactions { table-layout:fixed; }
    .biomass-transactions th { padding:1mm .7mm; }
    .biomass-transactions td { height:5.5mm; padding:1.2mm .7mm; vertical-align:middle; font-size:5.3pt; line-height:1.2; overflow-wrap:anywhere; }
    .biomass-transactions th:nth-child(1) { width:13%; }
    .biomass-transactions th:nth-child(2) { width:21%; }
    .biomass-transactions th:nth-child(3) { width:20%; }
    .biomass-transactions th:nth-child(4) { width:10%; }
    .biomass-transactions th:nth-child(5) { width:14%; }
    .biomass-transactions th:nth-child(6) { width:22%; }
    .market-card.gas .contract-table td,
    .market-card.power .contract-table td { padding-top:.6mm; padding-bottom:.6mm; }
    .market-card.coal .history-table td { padding-top:.65mm; padding-bottom:.65mm; }
    .contract-table th:first-child, .contract-table td:first-child { text-align:left; padding-left:1.5mm; }
    table .th-unit { color: #5d533f; font-weight: 600; }
    .market-card.coal .history-table td { padding-top:.6mm; padding-bottom:.6mm; }
    .market-card .range-position output { font-size:5.5pt; }
    .market-card.biomass > .biomass-content { justify-content:center; }
    .biomass-content > .table-scroll { flex:0 0 auto; }
    .eua-history .history-table td { padding-top:.6mm; padding-bottom:.6mm; }
    .biomass-price-note { margin-top:.5mm; font-size:4pt; line-height:1.2; color:#756b58; }
    .biomass-transactions a { color:inherit; text-decoration:underline; text-decoration-color:#b8a98c; }
    .biomass-transactions td:nth-child(3) { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div><label for="report-date">Dane na dzień</label><br><span id="date-range"></span></div>
    <div class="toolbar-controls">
      <input id="report-date" type="date" aria-label="Wybierz dzień danych">
      <button class="button" id="print-button" type="button">Drukuj / Zapisz PDF</button>
    </div>
  </div>
  <div class="paper-preview">
  <main>
    <header class="masthead">
      <div>
        <div class="eyebrow">Notowania i trendy</div>
        <h1>Raport rynków energetycznych</h1>
        <p>Gaz · Energia elektryczna · Węgiel · EUA · Zrębki drzewne</p>
      </div>
      <div class="report-date"><span>DANE NA DZIEŃ</span><strong id="report-date-label">—</strong></div>
    </header>
    <div id="dashboard" class="market-grid" aria-live="polite"></div>
    <footer><span id="generated-at"></span></footer>
  </main>
  </div>
  <script>__CHARTJS_SCRIPT__</script>
  <script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
  <script>
    (() => {
      "use strict";
      const DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
      const oneDay = 86400000;
      const dateInput = document.getElementById("report-date");
      const dateLabel = document.getElementById("report-date-label");
      const dashboard = document.getElementById("dashboard");
      const chartInstances = [];
      // Round every vertex of the L outline, including the concave shoulder.
      const roundMarketCorners = () => {
        dashboard.querySelectorAll(".market-card.eua,.market-card.biomass").forEach(section=>{
          const style=getComputedStyle(section);
          const w=section.offsetWidth,h=section.offsetHeight;
          const gap=parseFloat(style.rowGap);
          const y=parseFloat(style.gridTemplateRows)+gap;
          const left=section.classList.contains("eua");
          const x=left?(2*w-gap)/3:(w+gap)/3;
          const points=left?[[0,0],[x,0],[x,y],[w,y],[w,h],[0,h]]:[[x,0],[w,0],[w,h],[0,h],[0,y],[x,y]];
          const corners=points.map((point,index)=>{
            const previous=points[(index+points.length-1)%points.length],next=points[(index+1)%points.length];
            const before=Math.hypot(previous[0]-point[0],previous[1]-point[1]);
            const after=Math.hypot(next[0]-point[0],next[1]-point[1]);
            const radius=Math.min(3,before/2,after/2);
            const along=(target,length)=>point.map((value,axis)=>value+(target[axis]-value)*radius/length);
            return {point,start:along(previous,before),end:along(next,after)};
          });
          const path=`M ${corners[0].start.join(" ")} `+corners.map(c=>`L ${c.start.join(" ")} Q ${c.point.join(" ")} ${c.end.join(" ")}`).join(" ")+" Z";
          section.style.clipPath=`path('${path}')`;
        });
      };
      const locale = "pl-PL";
      const chartColors = {
        gas: {line:"#96516b",fill:"rgba(150,81,107,.12)"},
        power: {line:"#3d7198",fill:"rgba(61,113,152,.12)"},
        coal: {line:"#535b60",fill:"rgba(83,91,96,.12)"},
        eua: {line:"#647d61",fill:"rgba(100,125,97,.12)"},
      };
      const parseDate = value => {
        const [year, month, day] = String(value).slice(0, 10).split("-").map(Number);
        return new Date(Date.UTC(year, month - 1, day));
      };
      const iso = value => {
        const d = value instanceof Date ? value : parseDate(value);
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
      };
      const formatDate = value => parseDate(value).toLocaleDateString(locale, {day:"2-digit",month:"2-digit",year:"numeric",timeZone:"UTC"});
      const formatNumber = value => {
        const number = numeric(value);
        return number === null ? "—" : new Intl.NumberFormat(locale,{maximumFractionDigits:2}).format(number);
      };
      const numeric = value => {
        if (typeof value === "number" && Number.isFinite(value)) return value;
        if (typeof value !== "string") return null;
        const text = value.trim().replace(/\s/g,"").replace(/%$/,"").replace(",",".");
        const match = text.match(/^([+-]?\d+(?:\.\d+)?)([kKmM])?$/);
        if (!match) return null;
        const multiplier = match[2] ? (match[2].toLowerCase() === "k" ? 1000 : 1000000) : 1;
        return Number(match[1]) * multiplier;
      };
      const fmtMoney = (value, unit=" zł") => {
        const number = numeric(value);
        return number === null ? "—" : `${formatNumber(number)}${unit}`;
      };
      const fmtVolume = value => {
        const number = numeric(value);
        return number === null ? (value == null || value === "" ? "—" : String(value)) : `${formatNumber(number)} MWh`;
      };
      const sorted = rows => [...rows].sort((a,b) => a.trading_date.localeCompare(b.trading_date));
      const through = (rows, end) => sorted(rows.filter(row => row.trading_date.slice(0,10) <= end));
      const latest = rows => rows.length ? rows[rows.length-1] : null;
      const el = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const card = (title, subtitle, date, marketClass, wide=false) => {
        const section = el("section", `market-card ${marketClass}${wide ? " wide" : ""}`);
        const heading = el("div", "section-heading");
        const icons={
          gas:'<path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/>',
          power:'<path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/>',
          coal:'<path d="M11.264 2.205A4 4 0 0 0 6.42 4.211l-4 8a4 4 0 0 0 1.359 5.117l6 4a4 4 0 0 0 4.438 0l6-4a4 4 0 0 0 1.576-4.592l-2-6a4 4 0 0 0-2.53-2.53z"/><path d="M11.99 22 14 12l7.822 3.184"/><path d="M14 12 8.47 2.302"/>',
          eua:'<path d="M11 20a10 10 0 0010-10 25.9 25.9 0 00-1.04-7.281 1 1 0 00-1.755-.325C15.833 5.5 13 5.5 9.8 6.1A7 7 0 0011 20"/><path d="M2 21a5 5 0 012.911-4.544C7.613 15.212 8.351 15.24 11 13"/>',
          biomass:'<path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"/><path d="M7 16v6"/><path d="M13 19v3"/><path d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5"/>',
        };
        const icon=el("span","market-icon");
        icon.setAttribute("aria-hidden","true");
        icon.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[marketClass]||""}</svg>`;
        const left = el("div","market-heading-copy");
        left.append(el("h2", "", title), el("div", "subheading", subtitle));
        heading.append(icon,left, el("span", "date-badge", date ? formatDate(date) : "Brak notowań"));
        section.append(heading);
        return section;
      };
      const table = (headers, rows, numericColumns=[]) => {
        const wrap = el("div", "table-scroll");
        const t = document.createElement("table");
        const thead = document.createElement("thead");
        const head = document.createElement("tr");
        headers.forEach((value,index) => {
          const th = el("th", numericColumns.includes(index) ? "numeric" : "");
          if (typeof value === "string") {
            th.textContent = value;
          } else {
            th.append(el("span","th-label",value.label));
            if (value.unit) th.append(el("span","th-unit",value.unit));
          }
          head.append(th);
        });
        thead.append(head);
        const body = document.createElement("tbody");
        if (!rows.length) {
          const tr = document.createElement("tr"), td = el("td","empty","Brak danych dla wybranej daty.");
          td.colSpan = headers.length;
          tr.append(td); body.append(tr);
        } else {
          rows.forEach(row => {
            const tr = document.createElement("tr");
            row.forEach((value,index) => tr.append(el("td", numericColumns.includes(index) ? "numeric" : "", value == null ? "—" : String(value))));
            body.append(tr);
          });
        }
        t.append(thead,body); wrap.append(t); return wrap;
      };
      const reserveTableRows = (table, count) => {
        const body=table.tBodies[0];
        if(body.querySelector(".empty")){
          body.replaceChildren();
          table.setAttribute("aria-label","Brak danych dla wybranego dnia");
        }
        const columns=table.tHead.rows[0].cells.length;
        while(body.rows.length<count){
          const row=el("tr","placeholder-row");
          row.setAttribute("aria-hidden","true");
          for(let index=0;index<columns;index++) row.append(el("td","","\u00a0"));
          body.append(row);
        }
      };
      const addTable = (section, title, caption, headers, rows, numericColumns=[]) => {
        const titleRow = el("div","table-heading");
        titleRow.append(el("h3","",title),el("span","",caption));
        const tableElement=table(headers,rows,numericColumns);
        section.append(titleRow,tableElement);
        return tableElement;
      };
      const addContractTables = (section, caption, rows) => {
        const titleRow=el("div","table-heading contract-heading");
        titleRow.append(el("h3","","Kontrakty terminowe"),el("span","",caption));
        const pair=el("div","contract-pair");
        const headers=[
          {label:"Kontrakt"},
          {label:"DKR",unit:"(zł/MWh)"},
          {label:"Max",unit:"(zł/MWh)"},
          {label:"Wolumen",unit:"(MWh)"},
        ];
        const split=Math.ceil(rows.length/2);
        const halves=[rows.slice(0,split),rows.slice(split)];
        halves.forEach(items=>{
          const wrapper=table(headers,items,[1,2,3]);
          wrapper.querySelector("table").classList.add("contract-table");
          reserveTableRows(wrapper.querySelector("table"),5);
          pair.append(wrapper);
        });
        section.append(titleRow,pair);
      };
      const addKpis = (section, items) => {
        const grid = el("div","kpis");
        items.forEach((item,index) => {
          const box = el("div",`kpi${item.emphasis ? " emphasis" : ""}`);
          box.append(
            el("span","kpi-label",item.label),
            el("span",`kpi-value${item.tone ? " "+item.tone : ""}`,item.value),
            el("span","kpi-unit",item.unit||"\u00a0"),
          );
          grid.append(box);
        });
        section.append(grid);
      };
      const createChart = (rows, cfg) => {
        const wrap = el("div","chart-wrap");
        const chartInstruments={gas:"TGEgasDA",power:"TGeBase",coal:"Węgiel Rotterdam",eua:"EUA · kontrakt roczny"};
        wrap.append(el("div","chart-title",`Cena historyczna · do 30 dni · ${chartInstruments[cfg.marketClass]||cfg.title}`));
        if (!rows.length) {
          wrap.append(el("div","empty","Brak danych do wykresu."));
          return wrap;
        }
        const values=rows.map(row=>numeric(row[cfg.priceField]));
        if (!values.some(value=>value!==null)) {
          wrap.append(el("div","empty","Brak wartości liczbowych do wykresu."));
          return wrap;
        }
        const lastValueIndex=values.reduce((last,value,index)=>value===null?last:index,-1);
        const colors=chartColors[cfg.marketClass];
        const canvas=el("canvas","history-chart");
        canvas.setAttribute("role","img");
        canvas.setAttribute("aria-label",`Wykres historycznej ceny: ${cfg.title}`);
        const plot=el("div","chart-canvas");
        plot.append(canvas);
        wrap.append(plot);
        const chart=new Chart(canvas,{
          type:"line",
          data:{
            labels:rows.map(row=>formatDate(row.trading_date)),
            datasets:[{
              data:values,
              borderColor:colors.line,
              backgroundColor:colors.fill,
              borderWidth:1.6,
              fill:true,
              tension:0,
              spanGaps:false,
              pointRadius:context=>context.dataIndex===lastValueIndex?3:0,
              pointHoverRadius:4,
              pointBackgroundColor:colors.line,
              pointBorderColor:"#fff",
              pointBorderWidth:1.5,
            }],
          },
          options:{
            responsive:true,
            devicePixelRatio:Math.max(2,window.devicePixelRatio||1),
            maintainAspectRatio:false,
            animation:false,
            interaction:{intersect:false,mode:"index"},
            plugins:{
              legend:{display:false},
              tooltip:{
                backgroundColor:"#102638",
                titleColor:"#fff",
                bodyColor:"#fff",
                displayColors:false,
                padding:8,
                callbacks:{
                  label:context=>`${formatNumber(context.parsed.y)}${cfg.priceUnit}`,
                },
              },
            },
            scales:{
              x:{
                alignToPixels:true,
                afterBuildTicks:axis=>{
                  const count=Math.min(4,rows.length);
                  const positions=Array.from({length:count},(_,index)=>count===1?0:Math.round(index*(rows.length-1)/(count-1)));
                  axis.ticks=positions.map(value=>({value}));
                },
                border:{display:false},
                grid:{display:false},
                ticks:{
                  color:"#756b58",maxTicksLimit:4,autoSkip:false,maxRotation:0,font:{size:9},
                  callback:function(value) {
                    const row=rows[value];
                    return row ? parseDate(row.trading_date).toLocaleDateString(locale,{day:"2-digit",month:"2-digit",timeZone:"UTC"}) : "";
                  },
                },
              },
              y:{
                alignToPixels:true,
                border:{display:false},
                grid:{color:"#dbd1be"},
                ticks:{
                  color:"#756b58",
                  maxTicksLimit:3,
                  font:{size:9},
                  callback:value=>new Intl.NumberFormat(locale,{maximumFractionDigits:0}).format(value),
                },
              },
            },
          },
        });
        chartInstances.push(chart);
        return wrap;
      };
      const windowRows = (rows, asOf) => {
        const start = iso(new Date(parseDate(asOf).getTime() - 29*oneDay));
        return rows.filter(r => r.trading_date.slice(0,10) >= start && r.trading_date.slice(0,10) <= asOf);
      };
      const latestMetrics = (rows, asOf) => {
        const visible=through(rows,asOf), current=latest(visible);
        if (!current) return {current:null,window:[],previous:null};
        const history=windowRows(visible,asOf);
        const previous=visible.length>1 ? visible[visible.length-2] : null;
        return {current,window:history,previous};
      };
      const priceDelta = (current, previous, field) => {
        const latestPrice=numeric(current?.[field]), previousPrice=numeric(previous?.[field]);
        if (latestPrice===null || previousPrice===null) return null;
        const change=latestPrice-previousPrice;
        return {change,percent:previousPrice===0?null:change/previousPrice*100};
      };
      const signed = value => `${value>0?"+":""}${formatNumber(value)}`;
      const displayDelta = delta => {
        if (!delta) return "—";
        const arrow=delta.change>0?"↑ ":delta.change<0?"↓ ":"";
        return `${arrow}${signed(delta.change)}`;
      };
      const addRangePosition = (section, current, prices, field, unit) => {
        const value=numeric(current?.[field]);
        if (value===null || !prices.length) return;
        const min=Math.min(...prices), max=Math.max(...prices);
        if (value<min || value>max) return;
        const position=max===min?50:Math.max(0,Math.min(100,(value-min)/(max-min)*100));
        const range=el("div","range-position");
        const labels=el("div","range-labels");
        [["MIN · 30 DNI",min],["MAX · 30 DNI",max]].forEach(([label,value])=>{
          const endpoint=el("div","range-endpoint");
          endpoint.append(
            el("span","range-endpoint-label",label),
            el("strong","range-endpoint-value",formatNumber(value)),
            el("span","range-endpoint-unit",unit.trim()),
          );
          labels.append(endpoint);
        });
        const track=el("div","range-track");
        const marker=document.createElement("span");
        marker.style.left=`${position}%`;
        marker.setAttribute("aria-hidden","true");
        [25,50,75].forEach(position=>{
          const tick=el("i","range-tick");
          tick.style.left=`${position}%`;
          tick.setAttribute("aria-hidden","true");
          track.append(tick);
        });
        track.append(marker);
        const output=el("output","",`Pozycja ceny: ${Math.round(position)}%`);
        range.setAttribute("aria-label",`Pozycja ceny w przedziale 30 dni: ${Math.round(position)}%`);
        range.append(labels,track,output);
        section.append(range);
      };
      const periodDelta = (rows, asOf, days, field) => {
        const target=iso(new Date(parseDate(asOf).getTime()-days*oneDay));
        const baseline=latest(through(rows,target));
        return priceDelta(latest(through(rows,asOf)),baseline,field);
      };
      const addComparisons = (section, rows, asOf, field, unit) => {
        const comparisons=el("div","comparison-row");
        [7,30].forEach(days=>{
          const delta=periodDelta(rows,asOf,days,field);
          const text=delta?`${displayDelta(delta)}${unit}${delta.percent===null?"":` · ${signed(delta.percent)}%`}`:"—";
          const value=el("span",changeTone(delta?.change),`${days} dni: ${text}`);
          comparisons.append(value);
        });
        section.append(comparisons);
      };
      const volumeChange = (current, previous) => {
        const a=numeric(current?.volume_mwh ?? current?.volume), b=numeric(previous?.volume_mwh ?? previous?.volume);
        if (a===null || b===null) return "—";
        const diff=a-b;
        const pct=b===0 ? null : diff/b*100;
        return pct===null ? "—" : `${signed(pct)}%`;
      };
      const changeTone = value => {
        const number=numeric(value);
        return number===null ? "" : number>0 ? "positive" : number<0 ? "negative" : "";
      };
      const addPriceMetrics = (section, metrics, cfg) => {
        const row=metrics.current, prices=metrics.window.map(item=>numeric(item[cfg.priceField])).filter(value=>value!==null);
        const delta=priceDelta(row,metrics.previous,cfg.priceField);
        const percent=delta?.percent===null||!delta?"—":`${delta.percent>0?"↑ ":delta.percent<0?"↓ ":""}${signed(delta.percent)}%`;
        addKpis(section,[
          {label:"Kurs",value:formatNumber(row?.[cfg.priceField]),unit:cfg.priceUnit.trim(),emphasis:true},
          {label:"Zmiana ceny",value:percent,tone:changeTone(delta?.percent)},
          {label:"Wolumen",value:formatNumber(row?.[cfg.volumeField]),unit:cfg.volumeField==="volume_mwh"?"MWh":""},
          {label:"Zmiana wolumenu",value:volumeChange(row,metrics.previous),tone:changeTone(volumeChange(row,metrics.previous))},
        ]);
        addRangePosition(section,row,prices,cfg.priceField,cfg.priceUnit);
        addComparisons(section,metrics.allRows,metrics.asOf,cfg.priceField,cfg.priceUnit);
        section.append(createChart(metrics.window,cfg));
      };
      const addPriceMarket = (target, cfg, asOf) => {
        const allRows=DATA[cfg.key]||[];
        const rows=cfg.instrumentId?allRows.filter(row=>row.data_id===cfg.instrumentId):allRows;
        const metrics=latestMetrics(rows,asOf);
        metrics.allRows=rows;
        metrics.asOf=asOf;
        const row=metrics.current;
        const section=card(cfg.title,cfg.subtitle,row?.trading_date,cfg.marketClass,cfg.wide);
        addPriceMetrics(section,metrics,cfg);
        if (cfg.otfKey) {
          const contracts=through(DATA[cfg.otfKey]||[],asOf);
          const sessionDate=contracts.length?contracts[contracts.length-1].trading_date.slice(0,10):null;
          const sessionRows=contracts.filter(item=>item.trading_date.slice(0,10)===sessionDate);
          const groups=[["week",3],["month",4],["quarter",2],["year",1]];
          const selected=[];
          groups.forEach(([group,count])=>{
            sessionRows.filter(item=>item.data_id.startsWith(`${cfg.otfPrefix}_${group}_`))
              .sort((a,b)=>a.data_id.localeCompare(b.data_id,undefined,{numeric:true}))
              .slice(0,count).forEach(item=>selected.push([
                String(item.instrument||"").replace(cfg.contractPrefix,""),
                formatNumber(item.dkr_pln_mwh),
                formatNumber(item.max_pln_mwh),
                formatNumber(item.volume_mwh),
              ]));
          });
          addContractTables(section,sessionDate?`Sesja ${formatDate(sessionDate)}`:"Brak kontraktów",selected);
        }
        if (cfg.key==="power_rdn") addPowerIndices(section,allRows,asOf);
        target.append(section);
      };
      const addPowerIndices = (section, records, asOf) => {
        const available=through(records,asOf);
        const indexOrder=["tge_power_da_peak","tge_power_da_offpeak","tge_power_da_24"];
        const ids=[...new Set(available.map(row=>row.data_id).filter(id=>id&&id!=="tge_power_da_base"))].sort((a,b)=>{
          const rank=id=>indexOrder.includes(id)?indexOrder.indexOf(id):indexOrder.length;
          return rank(a)-rank(b)||a.localeCompare(b);
        });
        const heading=el("div","table-heading power-indices-heading");
        heading.append(el("h3","","Pozostałe indeksy energii"));
        const tiles=el("div","power-indices");
        ids.forEach(id=>{
          const series=available.filter(row=>row.data_id===id), current=latest(series);
          const tile=el("div","power-index");
          tile.append(
            el("span","power-index-name",current?.instrument||id),
            el("strong","power-index-price",formatNumber(current?.price_pln_mwh)),
            el("span","power-index-unit","zł/MWh"),
          );
          tiles.append(tile);
        });
        if (!ids.length) tiles.append(el("div","empty","Brak danych dla wybranej daty."));
        section.append(heading,tiles);
      };
      const addHistoryMarket = (target, key, title, subtitle, cfg, asOf) => {
        const rows=through(DATA[key]||[],asOf).map((record,index,array)=>{
          const delta=index?priceDelta(record,array[index-1],"price"):null;
          return {...record,change_pct:delta?.percent??null};
        });
        const metrics=latestMetrics(DATA[key]||[],asOf);
        metrics.allRows=DATA[key]||[];
        metrics.asOf=asOf;
        const section=card(title,subtitle,latest(rows)?.trading_date,cfg.marketClass);
        if (key==="eua") {
          const layout=el("div","eua-layout");
          const summary=el("div","eua-summary");
          const history=el("div","eua-history");
          addPriceMetrics(summary,metrics,cfg);
          const recent=rows.slice(-7).reverse().map(r=>[
            formatDate(r.trading_date),formatNumber(r.price),formatNumber(r.high),formatNumber(r.volume),
          ]);
          const priceUnit=`(${cfg.priceUnit.trim()})`;
          const historyTable=addTable(history,"Ostatnie notowania","",[
            "Data",{label:"Kurs",unit:priceUnit},{label:"Maks.",unit:priceUnit},"Wolumen",
          ],recent,[1,2,3]);
          historyTable.querySelector("table").classList.add("history-table");
          reserveTableRows(historyTable.querySelector("table"),key==="eua"?7:5);
          const chart=summary.querySelector(".chart-wrap");
          layout.append(summary,history,chart);
          section.append(layout);
          target.append(section);
          return;
        }
        addPriceMetrics(section,metrics,cfg);
        const recent=rows.slice(-5).reverse().map(r=>[formatDate(r.trading_date),formatNumber(r.price),formatNumber(r.high),formatNumber(r.volume)]);
        const priceUnit=`(${cfg.priceUnit.trim()})`;
        const historyTable=addTable(section,"Ostatnie notowania","",[
          "Data",
          {label:"Kurs",unit:priceUnit},
          {label:"Maks.",unit:priceUnit},
          "Wolumen",
        ],recent,[1,2,3]);
        historyTable.querySelector("table").classList.add("history-table");
          reserveTableRows(historyTable.querySelector("table"),key==="eua"?7:5);
        target.append(section);
      };
      // Table view: show up to nine latest available transactions.
      const BIOMASS_MAX_RECORDS=9;
      const addBiomass = (target, asOf) => {
        const transactions=(DATA.biomass_transactions||[]).filter(row=>row.date<=asOf);
        const linked=new Set(transactions.map(row=>row.tender_id).filter(Boolean));
        const tenderLabels={open:"Otwarty",awarded:"Rozstrzygnięty",cancelled:"Unieważniony",closed_without_result:"Bez wyniku"};
        const latestTenders=new Map();
        (DATA.biomass_tenders||[]).filter(row=>row.status_date<=asOf && row.checked_as_of<=asOf).forEach(row=>{
          const old=latestTenders.get(row.tender_id);
          if(!old || row.checked_as_of>old.checked_as_of || (row.checked_as_of===old.checked_as_of && row.retrieved_at>old.retrieved_at)) latestTenders.set(row.tender_id,row);
        });
        const notices=[...latestTenders.values()].filter(row=>!linked.has(row.tender_id)).map(row=>({
          ...row,date:row.status_date,record_type:"tender_notice",kind:`${tenderLabels[row.status]} · ${row.kind}`,
          date_basis:"tender_status",price_pln_t:null,price_basis:"unknown",transport:"unknown",
        }));
        const samples=[...transactions,...notices].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,BIOMASS_MAX_RECORDS);
        const section=card("Rynek zrębków drzewnych","Transakcje i przetargi · Polska",samples[0]?.date,"biomass");
        section.querySelector(".date-badge").textContent=samples.length?formatDate(samples[0].date):"Brak notowań";

        const content=el("div","biomass-content");
        const rows=samples.map(row=>[
          formatDate(row.date),row.buyer??"—",row.kind,
          formatNumber(row.volume_t),
          row.price_pln_t==null?"—":`${fmtMoney(row.price_pln_t," zł/t")} ${row.price_basis==="net"?"netto":row.price_basis==="gross"?"brutto":"*"}`,
          `${row.source_name} · ${row.record_type==="tender_notice"?tenderLabels[row.status]:row.record_type==="tender_award"?"wynik przetargu":"transakcja"}`,
        ]);
        const wrapper=table(["Data","Podmiot","Rodzaj","Wolumen","Cena","Źródło"],rows,[3,4]);
        wrapper.querySelector("table").classList.add("biomass-transactions");
        wrapper.querySelectorAll("tbody tr").forEach((tr,index)=>{
          const record=samples[index];
          if(!record) return;
          const source=document.createElement("a");
          const displayUrl=record.source_url.replace(/^https?:\/\//i, "").replace(/^www\./i, "");
          source.textContent=displayUrl.length>30?`${displayUrl.slice(0,30)}…`:displayUrl;
          source.href=record.source_url;
          source.target="_blank";
          source.rel="noopener noreferrer";
          source.title=`${record.source_url}\n${record.evidence}${record.deadline?`\nTermin ofert: ${record.deadline}`:""}`;
          tr.cells[5].replaceChildren(source);
          tr.cells[2].title=record.kind;
          tr.cells[0].title=record.date_basis==="tender_status"?"Data statusu przetargu":record.date_basis==="award_publication"?"Data publikacji wyniku przetargu":"Data transakcji";
          tr.cells[4].title=`Transport: ${record.transport==="included"?"wliczony":record.transport==="excluded"?"niewliczony":"nie podano"}`;
        });
        reserveTableRows(wrapper.querySelector("table"),BIOMASS_MAX_RECORDS);
        content.append(wrapper);
        if (samples.some(row=>row.price_pln_t!=null)) content.append(el("div","biomass-price-note","* Nie podano podstawy VAT. Zakres transportu może się różnić."));
        section.append(content);
        target.append(section);
      };
      const render = () => {
        const asOf=dateInput.value || DATA.max_date;
        dateLabel.textContent=formatDate(asOf);
        document.getElementById("date-range").textContent=`Dostępne dane: ${formatDate(DATA.min_date)} – ${formatDate(DATA.max_date)}`;
        chartInstances.forEach(chart=>chart.destroy());
        chartInstances.length=0;
        dashboard.replaceChildren();
        addPriceMarket(dashboard,{key:"gas_rdn",title:"Rynek gazu",subtitle:"Rynek dnia następnego · TGEgasDA",priceField:"price_pln_mwh",volumeField:"volume_mwh",priceUnit:" zł/MWh",marketClass:"gas",wide:true,otfKey:"gas_otf",otfPrefix:"gas_base",contractPrefix:"GAS_BASE_"},asOf);
        addPriceMarket(dashboard,{key:"power_rdn",title:"Rynek energii elektrycznej",subtitle:"Rynek dnia następnego · TGeBase",instrumentId:"tge_power_da_base",priceField:"price_pln_mwh",volumeField:"volume_mwh",priceUnit:" zł/MWh",marketClass:"power",wide:true,otfKey:"power_otf",otfPrefix:"power_base",contractPrefix:"BASE_"},asOf);
        addHistoryMarket(dashboard,"coal","Rynek węgla","Kontrakty terminowe · Węgiel Rotterdam",{priceField:"price",volumeField:"volume",priceUnit:" PLN/t",marketClass:"coal"},asOf);
        addHistoryMarket(dashboard,"eua","Rynek EUA","Kontrakty roczne · Uprawnienia do emisji CO₂",{priceField:"price",volumeField:"volume",priceUnit:" PLN/t",marketClass:"eua"},asOf);
        addBiomass(dashboard,asOf);
        requestAnimationFrame(()=>{
          roundMarketCorners();
          chartInstances.forEach(chart=>{
            const plot=chart.canvas.parentElement;
            chart.resize(plot.clientWidth,plot.clientHeight);
          });
        });
      };
      dateInput.min=DATA.min_date;
      dateInput.max=DATA.report_date && DATA.report_date>DATA.max_date?DATA.report_date:DATA.max_date;
      dateInput.value=DATA.report_date || DATA.max_date;
      dateInput.addEventListener("change",render);
      document.getElementById("print-button").addEventListener("click",()=>window.print());
      window.addEventListener("beforeprint",()=>{roundMarketCorners();chartInstances.forEach(chart=>chart.resize());});
      document.getElementById("generated-at").textContent=`Wygenerowano ${new Date().toLocaleString(locale)}`;
      const preview = document.querySelector(".paper-preview");
      const report = preview.querySelector("main");
      const fitReport = () => {
        const scale = Math.min(1, Math.max(0, document.documentElement.clientWidth - 24) / report.offsetWidth);
        roundMarketCorners();
        preview.style.setProperty("--preview-scale", scale);
        preview.style.width = `${report.offsetWidth * scale}px`;
        preview.style.height = `${report.offsetHeight * scale}px`;
      };
      window.addEventListener("resize", fitReport);
      window.addEventListener("afterprint", () => {
        fitReport();
        chartInstances.forEach(chart => chart.resize());
      });
      fitReport();
      render();
    })();
  </script>
</body>
</html>
